# Secrets (environment ou repositório):
# - CAPROVER_SERVER_URL
# - CAPROVER_WEBSITE_APP_TOKEN  → token do app site-cezarpretto-dev no CapRover
#
# Variáveis (environment/repo — vars, não secrets), build Next.js:
# - NEXT_PUBLIC_WHATSAPP_NUMBER  → formato internacional (ex.: 5511999998888); vazio esconde o card WhatsApp
name: Deploy website to CapRover

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: caprover

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CapRover CLI
        run: npm install -g caprover

      - name: Build website
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        run: |
          npm ci
          npm run build

      - name: Pack website for CapRover
        run: |
          tar -cvf website-deploy.tar \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.tar' \
            --exclude='.next/cache' \
            captain-definition \
            Dockerfile \
            package.json \
            package-lock.json \
            next.config.js \
            .next

      - name: Deploy to CapRover Server
        run: |
          caprover deploy \
            --host "${{ secrets.CAPROVER_SERVER_URL }}" \
            --appToken "${{ secrets.CAPROVER_WEBSITE_APP_TOKEN }}" \
            --appName "site-cezarpretto-dev" \
            --tarFile website-deploy.tar
